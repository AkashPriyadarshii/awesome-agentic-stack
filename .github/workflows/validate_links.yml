name: Validate Links

on:
  schedule:
    - cron: '0 0 1 * *' # Run 1st of every month at 00:00 UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Validate Markdown Links
        id: linkcheck
        run: |
          echo "Checking links..."
          markdown-link-check README.md WORKFLOW.md CONTRIBUTING.md lists/rejected.md lists/watching.md > link-check-results.log 2>&1 || echo "failed=true" >> $GITHUB_OUTPUT

      - name: Create Issue on Failure
        if: steps.linkcheck.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let log = 'No log found';
            try {
              log = fs.readFileSync('link-check-results.log', 'utf8');
            } catch (err) {
              console.error(err);
            }
            
            const date = new Date();
            const month = date.toLocaleString('default', { month: 'long' });
            const year = date.getFullYear();
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Broken links detected — ${month} ${year}`,
              body: `### ⚠️ Broken Link Verification Report\n\nSome links inside the stack files failed the monthly link validation run:\n\n\`\`\`text\n${log}\n\`\`\`\n\n*This issue was auto-generated by the validate_links.yml workflow.*`
            });
